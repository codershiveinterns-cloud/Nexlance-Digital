<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Nexlance</title>
<link rel="stylesheet" href="app.css">
<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f5f0ff 0%, #fffaf5 100%);
    display: grid;
    place-items: center;
    padding: 24px;
}

.admin-login-card {
    width: min(100%, 440px);
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #ece7fb;
    border-radius: 28px;
    box-shadow: 0 28px 60px rgba(76, 63, 191, 0.16);
    padding: 32px;
}

.admin-login-card h1 {
    margin: 0 0 10px;
    color: #2d1b69;
}

.admin-login-card p {
    margin: 0 0 24px;
    color: #706b84;
    line-height: 1.6;
}

.admin-login-form {
    display: grid;
    gap: 16px;
}

.admin-login-form label {
    display: grid;
    gap: 8px;
    font-size: 0.92rem;
    color: #4f4565;
    font-weight: 600;
}

.admin-login-form input {
    border: 1px solid #d8cff7;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 1rem;
}

.admin-login-form button {
    border: none;
    border-radius: 999px;
    padding: 14px 18px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #4b3fbf, #6c5ce7);
}

.admin-login-meta {
    margin-top: 16px;
    font-size: 0.88rem;
    color: #8b84a3;
}

.admin-login-message {
    min-height: 22px;
    font-size: 0.92rem;
}

.admin-login-message.error {
    color: #d63031;
}

.admin-login-message.success {
    color: #0f8b5f;
}
</style>
</head>
<body>
    <section class="admin-login-card">
        <h1>Secure Admin Access</h1>
        <p>Only the authorized Nexlance admin account can continue. This login is validated by the backend and protected with a server session.</p>

        <form class="admin-login-form" id="adminLoginForm">
            <label>
                Admin email
                <input type="email" id="adminEmail" autocomplete="username" required>
            </label>
            <label>
                Password
                <input type="password" id="adminPassword" autocomplete="current-password" required>
            </label>
            <button type="submit" id="adminLoginBtn">Log In to Admin Panel</button>
            <div class="admin-login-message" id="adminLoginMessage"></div>
        </form>

        <div class="admin-login-meta">
            Unauthorized users cannot access the admin dashboard or its APIs, even by direct URL.
        </div>
    </section>

<script>
const params = new URLSearchParams(window.location.search);
const redirectTarget = params.get('redirect') || 'admin.html';
const form = document.getElementById('adminLoginForm');
const button = document.getElementById('adminLoginBtn');
const message = document.getElementById('adminLoginMessage');

function getAdminApiUrl(pathname) {
    const normalizedPath = String(pathname || '').startsWith('/')
        ? String(pathname || '')
        : `/${String(pathname || '')}`;

    if (window.location.protocol === 'file:') {
        return `http://localhost:4242${normalizedPath}`;
    }

    if (/^(localhost|127\\.0\\.0\\.1)$/i.test(window.location.hostname) && window.location.port && window.location.port !== '4242') {
        return `http://localhost:4242${normalizedPath}`;
    }

    return normalizedPath;
}

function setMessage(text, type) {
    message.textContent = text || '';
    message.className = 'admin-login-message' + (type ? ` ${type}` : '');
}

async function checkSession() {
    const response = await fetch(getAdminApiUrl('/api/admin/session'), { credentials: 'include' });
    const data = await response.json().catch(() => ({}));
    if (response.ok && data.authenticated) {
        window.location.href = redirectTarget;
    }
}

form.addEventListener('submit', async event => {
    event.preventDefault();
    setMessage('', '');
    button.disabled = true;
    button.textContent = 'Signing in...';

    try {
        const response = await fetch(getAdminApiUrl('/api/admin/login'), {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('adminEmail').value,
                password: document.getElementById('adminPassword').value
            })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            if (response.status === 404) {
                throw new Error('Admin backend is not available. Start the Nexlance server first.');
            }
            throw new Error(data.error || 'Admin login failed.');
        }

        setMessage('Admin session created. Redirecting...', 'success');
        localStorage.setItem('nexlance_admin_ui', JSON.stringify({
            email: document.getElementById('adminEmail').value.trim().toLowerCase(),
            authenticatedAt: new Date().toISOString()
        }));
        window.location.href = redirectTarget;
    } catch (error) {
        const fallbackMessage = error && error.message ? error.message : 'Admin login failed.';
        setMessage(fallbackMessage.includes('Failed to fetch')
            ? 'Could not reach the admin backend. Make sure the Nexlance server is running.'
            : fallbackMessage, 'error');
        button.disabled = false;
        button.textContent = 'Log In to Admin Panel';
    }
});

checkSession().catch(() => {});
</script>
</body>
</html>
